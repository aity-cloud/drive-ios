# Aity Drive iOS Factory pipeline (meta/specs/aity-drive-v1.md, ADR 0001).
#
# materialize -> build -> smoke -> publish-staging -> promote -> mirror
#
# The Linux jobs (lint) validate everything a Linux runner can validate:
# scripts, plists, this file, and a full materialise of BOTH Environments
# against the real upstream clone (patch application + overlay path drift).
# Every job that needs Xcode is tagged `macos` and stays `when: manual`
# until the macos runner exists (meta/docs/runbooks/mac-runner.md); the
# iOS compile itself happens inside the smoke/publish/promote lanes (gym
# builds as part of upload), so the `build` stage carries no job of its
# own in this Factory.
#
# Secrets (protected CI variables, never in the repo): ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8 (file), MATCH_PASSWORD, MATCH_GIT_PRIVATE_KEY
# (file), AITY_TEAM_ID, GITHUB_MIRROR_KEY (file) - see
# meta/docs/runbooks/publisher-accounts.md. The lanes fail fast with a
# clear message when any of them is absent.

stages: [materialize, build, smoke, publish-staging, promote, mirror]

# Every job runs on our own runner unless it explicitly overrides (the macOS
# jobs do). gitlab.com instance runners are disabled for the whole aity-cloud
# group since 2026-08-27 - drive/desktop's Windows build is the only exception -
# so a new job that forgets `tags:` sits stuck-pending instead of silently
# burning purchased compute minutes.
default:
  tags: [docker, shared]
  interruptible: true

variables:
  # The Pin (ADR 0001). Renovate watches the upstream tag; the ios-sdk
  # submodule has no pin of its own - scripts/materialize.sh checks it out
  # at the commit this app tag records, so bumping UPSTREAM_TAG moves both.
  # renovate: datasource=github-tags depName=owncloud/ios-app
  UPSTREAM_TAG: "v12.7.0"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Linux validation - runs on every main push and tag.
# ---------------------------------------------------------------------------

lint:
  stage: materialize
  image: registry.aity.tech/catalog/library/alpine:3.22
  tags: [docker, shared]
  interruptible: true
  script:
    - apk add --no-cache bash git python3 ruby shellcheck yamllint >/dev/null
    - shellcheck scripts/*.sh
    - python3 -m py_compile scripts/*.py
    - python3 scripts/check-plists.py
    - |
      yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" \
        .gitlab-ci.yml smoke/project.yml
    - |
      for rb in Gemfile fastlane/Appfile fastlane/Matchfile fastlane/Fastfile; do
        ruby -c "$rb"
      done
    # `ruby -c` cannot see it: a comment after a backslash line-continuation
    # silently truncates the string, which faked a green smoke on 2026-08-27.
    - ruby scripts/check-fastfile.rb
    # Full materialise of both Environments against the real Pin clone:
    # proves the tag exists, the ios-sdk submodule resolves, every patch
    # applies, and every overlay/recipe path still matches the upstream
    # tree (--check). The staging run reuses the production clone.
    - bash scripts/materialize.sh production --check
    - bash scripts/materialize.sh staging --check

# The XCUITest sources, type-checked without Xcode. `ruby -c`-grade parsing is
# not enough: `swiftc -parse` never resolves a name, so a call to a helper that
# was deleted compiles clean locally and fails on the Mac - which is Raul's
# laptop, one job at a time. This catches that class before anyone triggers an
# Xcode job. It is a NAME and ARITY check against hand-written stubs, not an
# API-compatibility check (see smoke/typecheck/XCTestStubs.swift).
typecheck:smoke:
  stage: materialize
  image: swift:6.1
  tags: [docker, shared]
  interruptible: true
  # Not in the curated registry.aity.tech mirror, so this comes from Docker Hub
  # and inherits that path's flakiness (drive/desktop/MAINTAINING.md).
  retry:
    max: 2
    when: [runner_system_failure, api_failure, unknown_failure]
  script:
    - swiftc -typecheck smoke/typecheck/XCTestStubs.swift smoke/AityDriveSmokeUITests/*.swift

# ---------------------------------------------------------------------------
# Xcode jobs - manual until the macos runner exists (runbooks/mac-runner.md).
# Each one re-materialises its Environment on the Mac; nothing is passed
# between jobs. Manual jobs are allow_failure by default, so the mirror
# stage still runs on plain main pushes.
# ---------------------------------------------------------------------------

.macos:
  tags: [macos]
  when: manual
  # NOT interruptible. The default block marks everything interruptible so a
  # new push supersedes a running pipeline, which is right for the Linux jobs
  # and wrong for these: a manual Xcode job is a deliberate act on Raul's
  # laptop, and having an unrelated push to main cancel one mid-run wastes
  # the scarcest resource this Factory has (2026-08-27, a five-run flakiness
  # measurement lost at run 2).
  interruptible: false
  # No `needs` on the Linux stage: these jobs re-materialise the whole tree
  # on the Mac and consume nothing from lint, so waiting for it only couples
  # them to a runner they do not use. That coupling cost a full verification
  # cycle on 2026-08-27, when the Linux runner could not resolve
  # registry.aity.tech and every Xcode job sat queued behind a stuck image
  # pull for 40 minutes. lint still gates nothing less: it runs on every push
  # and a red lint is still a red pipeline.
  needs: []
  timeout: 2h
  variables:
    # Xcode per the Pin's .xcode-version; selected via DEVELOPER_DIR by
    # `xcodes` on the runner, enforced by ensure_xcode_version in the lane.
    LC_ALL: en_US.UTF-8
    LANG: en_US.UTF-8

# Tier 2. Two XCUITests against the staging build on the simulator:
# the login-screen smoke (no network) and the ACCOUNT JOURNEY - sign in as
# the contract user through the app's own OIDC browser sheet, see a file that
# was seeded over WebDAV before launch, create a folder from the app, delete
# it again, leave staging clean. AITY_CONTRACT_USER / AITY_CONTRACT_PASSWORD
# are protected group variables; without them the journey skips itself and
# only the login-screen smoke runs.
smoke:simulator:
  extends: .macos
  stage: smoke
  script:
    - bash scripts/materialize.sh staging
    - brew bundle --file Brewfile
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios build_simulator_smoke
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - build/upstream/fastlane/xcodebuild-*.log
      - build/smoke-results/

# The pass-rate measurement (MAINTAINING.md, "Tier 2: how the OIDC login is
# driven"). Reuses the app the previous run built - AITY_SMOKE_SKIP_BUILD -
# so N runs cost N test executions, not N compiles of the whole Pin on a
# MacBook Air. Reports the rate; only a 0/N is a hard failure.
# Read-only: print the crash reports the simulator wrote for our app.
# "Unexpected termination" in XCUITest tells you nothing about WHY; the
# reason is in DiagnosticReports on the runner (simulator app crashes land
# in the HOST's ~/Library/Logs/DiagnosticReports since Xcode 11). Added
# 2026-08-27 while chasing "the app terminates after opening the personal
# space" - reading this before touching the test is the whole point.
diagnose:crash-reports:
  extends: .macos
  stage: smoke
  allow_failure: true
  script:
    - |
      set -eu
      echo "=== recent DiagnosticReports mentioning the app ==="
      DIR="$HOME/Library/Logs/DiagnosticReports"
      ls -t "$DIR" 2>/dev/null | head -40 || echo "(no DiagnosticReports directory)"
      echo
      found=0
      for f in $(ls -t "$DIR"/*.ips "$DIR"/*.crash 2>/dev/null | head -60); do
        if grep -q "tech.aity.drive" "$f" 2>/dev/null; then
          found=$((found+1))
          echo "########## $f"
          # .ips files are a JSON header line followed by a JSON payload
          python3 - "$f" <<'PYEOF'
      import json, sys
      raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
      parts = raw.split("\n", 1)
      try:
          head = json.loads(parts[0])
          print("  app_name      :", head.get("app_name"), head.get("app_version"))
          print("  timestamp     :", head.get("timestamp"))
      except Exception:
          print(parts[0][:200])
      body = {}
      if len(parts) > 1:
          try:
              body = json.loads(parts[1])
          except Exception:
              print(parts[1][:1500]); raise SystemExit
      print("  exception     :", body.get("exception"))
      print("  termination   :", body.get("termination"))
      print("  isCorpse      :", body.get("isCorpse"), " asi:", str(body.get("asi"))[:300])
      faulting = body.get("faultingThread")
      for i, th in enumerate(body.get("threads", [])):
          if th.get("triggered") or i == faulting:
              print("  --- triggered thread", i, th.get("name") or "")
              used = body.get("usedImages", [])
              for fr in th.get("frames", [])[:22]:
                  idx = fr.get("imageIndex", -1)
                  img = used[idx].get("name") if 0 <= idx < len(used) else "?"
                  print("     %-28s %s +%s" % (img, fr.get("symbol") or "", fr.get("imageOffset")))
              break
      PYEOF
          echo
        fi
      done
      [ "$found" -gt 0 ] || echo "NO crash report mentions tech.aity.drive - the app was terminated WITHOUT crashing (look at jetsam/appstate, not a stack)."
      echo "=== simulator jetsam / termination events ==="
      log show --last 30m --style compact --predicate 'process == "SpringBoard" OR eventMessage CONTAINS "tech.aity.drive"' 2>/dev/null | grep -i -E 'termin|jetsam|watchdog|kill' | tail -25 || echo "(log show unavailable)"

measure:smoke-flakiness:
  extends: .macos
  stage: smoke
  allow_failure: true
  variables:
    AITY_SMOKE_REPEAT: "5"
    AITY_SMOKE_SKIP_BUILD: "true"
    AITY_SMOKE_TESTS: AityDriveSmokeUITests/AccountJourneySmokeTests
  script:
    - bash scripts/materialize.sh staging
    - brew bundle --file Brewfile
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios build_simulator_smoke
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - build/upstream/fastlane/xcodebuild-*.log
      - build/smoke-results/

# ONE-TIME, and deliberately not part of any release flow: registers the
# App IDs and App Store Connect records for both Environments and writes
# the certificate + profiles into the match store. Idempotent - re-running
# creates only what is missing. Prints the Apple Team ID, which then has to
# be set as the protected group variable AITY_TEAM_ID.
bootstrap:apple:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh production
    - brew bundle --file Brewfile
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios aity_bootstrap_apple
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - apple-team-id.txt

# One-time: internal tester group + testers + newest build attached.
setup:testflight-internal:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh production
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios aity_setup_testflight_internal

# Read-only diagnostic: what TestFlight has and who can see it.
check:testflight:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh production
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios aity_check_testflight

# Read-only diagnostic: which App IDs actually carry an App Group.
check:app-groups:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh production
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios aity_check_app_groups

publish:staging-testflight:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh staging
    - brew bundle --file Brewfile
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios build_staging_testflight
  artifacts:
    when: always
    expire_in: 3 months
    paths:
      - build/upstream/*.ipa
      - build/upstream/fastlane/gym-logs/

# The PRE-PROD channel: the production binary (drive.aity.tech) on
# TestFlight for external testers, months before it is on the App Store.
# Uploads only by default; set AITY_TF_EXTERNAL=true (plus ASC_DEMO_USER /
# ASC_DEMO_PASSWORD) as job variables to also send it to the tester group,
# which puts the first build through Beta App Review.
publish:preprod-testflight:
  extends: .macos
  stage: publish-staging
  script:
    - bash scripts/materialize.sh production
    - brew bundle --file Brewfile
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios build_preprod_testflight
  artifacts:
    when: always
    expire_in: 3 months
    paths:
      - build/upstream/*.ipa
      - build/upstream/fastlane/gym-logs/

promote:production-appstore:
  extends: .macos
  stage: promote
  rules:
    # Promote is the single manual act that moves a release to the public
    # listing (CONTEXT.md); it exists on tag pipelines only.
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - bash scripts/materialize.sh production
    - cd build/upstream
    - bundle install
    - bundle exec fastlane ios build_production_appstore
  artifacts:
    paths:
      - build/upstream/*.ipa

# ---------------------------------------------------------------------------
# Public Mirror (ADR 0004) - CI is the only writer.
# ---------------------------------------------------------------------------

include:
  - project: aity-cloud/drive/meta
    ref: main
    file: ci/mirror.yml
